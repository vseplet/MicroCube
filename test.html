<script type="text/wgsl" id="tickwgsl">
struct Cfg {
  players: u32,
  hist: u32,
  tick: u32,
  maxVis: u32,
  dt: f32,
  reach: f32,
  cells: u32,
  _pad1: f32,
};

struct Player {
  pos: vec3<f32>,
  yaw: f32,
  vel: vec3<f32>,
  hp: f32,
};

struct Input {
  move_: vec2<f32>,
  yaw: f32,
  shoot: f32,
  pitch: f32,
  aimT: f32,
  _p1: f32,
  _p2: f32,
};

struct Hit {
  shooter: u32,
  victim: u32,
  dist: f32,
  tick: u32,
};

@group(0) @binding(0) var<uniform> cfg: Cfg;
@group(0) @binding(1) var<storage, read_write> players: array<Player>;
@group(0) @binding(2) var<storage, read> inputs: array<Input>;
@group(0) @binding(3) var<storage, read_write> hist: array<vec4<f32>>;
@group(0) @binding(4) var<storage, read_write> visCount: array<atomic<u32>>;
@group(0) @binding(5) var<storage, read_write> visList: array<u32>;
@group(0) @binding(6) var<storage, read_write> hitCount: array<atomic<u32>>;
@group(0) @binding(7) var<storage, read_write> hits: array<Hit>;
@group(0) @binding(8) var<storage, read_write> cellOf: array<u32>;
@group(0) @binding(9) var<storage, read> cellAnchor: array<vec4<f32>>;
@group(0) @binding(10) var<storage, read_write> cellVis: array<u32>;
@group(0) @binding(11) var<storage, read_write> bullets: array<vec4<f32>>;
@group(0) @binding(12) var<storage, read_write> craterReq: array<vec4<f32>>;
@group(0) @binding(13) var<storage, read_write> world: array<u32>;
@group(0) @binding(14) var<storage, read_write> worldBits: array<atomic<u32>>;

const BULLET_R = 3.5;

const CELL_W = 64.0;

const SCALE = 10.0;
const SEED = 7;
const GROUND = 90.0;
const HILLS = 40.0;
const ISLE_Y = 170.0;
const ISLE_SIZE = 60.0;
const ISLE_AMOUNT = 0.7;
const NY = 256.0;
const WORLD = 1024.0;
const ARENA = 896.0;

fn hash2(x: i32, z: i32, s: i32) -> f32 {
  var h = u32(x) * 374761393u + u32(z) * 668265263u + u32(s) * 1274126177u;
  h = (h ^ (h >> 13u)) * 1274126177u;
  h = h ^ (h >> 16u);
  return f32(h) / 4294967296.0;
}

fn vnoise(x: f32, z: f32, s: i32) -> f32 {
  let ix = i32(floor(x));
  let iz = i32(floor(z));
  let fx = x - floor(x);
  let fz = z - floor(z);
  let ux = fx * fx * (3.0 - 2.0 * fx);
  let uz = fz * fz * (3.0 - 2.0 * fz);
  let a = hash2(ix, iz, s);
  let b = hash2(ix + 1, iz, s);
  let c = hash2(ix, iz + 1, s);
  let d = hash2(ix + 1, iz + 1, s);
  return (a + (b - a) * ux) * (1.0 - uz) + (c + (d - c) * ux) * uz;
}

fn noise3(x: f32, y: f32, z: f32, s: i32) -> f32 {
  let iy = i32(floor(y));
  let f = y - floor(y);
  let u = f * f * (3.0 - 2.0 * f);
  return vnoise(x, z, s + iy * 37) * (1.0 - u) + vnoise(x, z, s + (iy + 1) * 37) * u;
}

fn heightAt(wx: f32, wz: f32) -> f32 {
  let n = vnoise(wx / (12.0 * SCALE), wz / (12.0 * SCALE), SEED) * 0.55
    + vnoise(wx / (5.0 * SCALE), wz / (5.0 * SCALE), SEED + 1) * 0.3
    + vnoise(wx / (2.0 * SCALE), wz / (2.0 * SCALE), SEED + 2) * 0.15;
  let ridge = 1.0 - abs(vnoise(wx / (22.0 * SCALE), wz / (22.0 * SCALE), SEED + 3) * 2.0 - 1.0);
  return round(GROUND + (n - 0.5) * HILLS * 2.0 + ridge * ridge * HILLS * 0.8);
}

fn isleAt(wx: f32, y: f32, wz: f32) -> f32 {
  if(abs(y - ISLE_Y) > ISLE_SIZE * 1.4) { return 0.0; }
  return noise3(wx / ISLE_SIZE, y / (ISLE_SIZE * 0.6), wz / ISLE_SIZE, 53)
    - abs(y - ISLE_Y) / (ISLE_SIZE * 1.4);
}

fn solidAt(p: vec3<f32>) -> bool {
  if(p.y < 0.0) { return true; }
  if(p.y >= NY) { return false; }
  let x = i32(floor(p.x + WORLD * 0.5));
  let z = i32(floor(p.z + WORLD * 0.5));
  if(x < 0 || z < 0 || x >= i32(WORLD) || z >= i32(WORLD)) { return false; }
  let y = u32(p.y);
  let word = (u32(z) * u32(WORLD) + u32(x)) * 8u + (y >> 5u);
  return ((world[word] >> (y & 31u)) & 1u) == 1u;
}

@compute @workgroup_size(64)
fn gen_world(@builtin(global_invocation_id) gid: vec3<u32>) {
  let col = gid.x;
  let n = u32(WORLD);
  if(col >= n * n) { return; }
  let x = col % n;
  let z = col / n;
  let wx = f32(x) - WORLD * 0.5;
  let wz = f32(z) - WORLD * 0.5;
  let h = heightAt(wx, wz);
  for(var w = 0u; w < 8u; w++) {
    var bits = 0u;
    for(var b = 0u; b < 32u; b++) {
      let y = f32(w * 32u + b);
      var solid = y < h;
      if(!solid && abs(y - ISLE_Y) < ISLE_SIZE * 1.4) {
        solid = isleAt(wx, y, wz) > ISLE_AMOUNT;
      }
      if(solid) { bits |= 1u << b; }
    }
    world[col * 8u + w] = bits;
  }
}

fn blocked(o: vec3<f32>, d: vec3<f32>, maxT: f32) -> bool {
  var t = 1.0;
  loop {
    if(t >= maxT - 1.0) { break; }
    if(solidAt(o + d * t)) { return true; }
    t += 1.0;
  }
  return false;
}

@compute @workgroup_size(64)
fn move_players(@builtin(global_invocation_id) gid: vec3<u32>) {
  let i = gid.x;
  if(i >= cfg.players) { return; }
  var p = players[i];
  if(p.hp < 0.5) {
    hist[(cfg.tick % cfg.hist) * cfg.players + i] = vec4<f32>(p.pos, p.yaw);
    return;
  }
  let inp = inputs[i];

  p.yaw = inp.yaw;
  let s = sin(p.yaw);
  let c = cos(p.yaw);
  let wish = vec3<f32>(inp.move_.x * c + inp.move_.y * s, 0.0, inp.move_.y * c - inp.move_.x * s);
  let speed = 4.5 * SCALE * select(1.0, 1.9, (u32(inp.shoot + 0.5) & 4u) != 0u);
  p.vel = vec3<f32>(wish.x * speed, p.vel.y - 26.0 * SCALE * cfg.dt, wish.z * speed);

  var pos = p.pos;
  let stepH = 6.0;
  let nx = pos.x + p.vel.x * cfg.dt;
  let nz = pos.z + p.vel.z * cfg.dt;
  let wallX = solidAt(vec3<f32>(nx, pos.y + stepH + 1.0, pos.z)) || solidAt(vec3<f32>(nx, pos.y + 15.0, pos.z));
  if(!wallX) { pos.x = nx; }
  let wallZ = solidAt(vec3<f32>(pos.x, pos.y + stepH + 1.0, nz)) || solidAt(vec3<f32>(pos.x, pos.y + 15.0, nz));
  if(!wallZ) { pos.z = nz; }

  if(p.vel.y > 0.0) {
    let ny = pos.y + p.vel.y * cfg.dt;
    if(solidAt(vec3<f32>(pos.x, ny + 17.0, pos.z))) { p.vel.y = 0.0; } else { pos.y = ny; }
  } else {
    var ground = -1.0;
    for(var k = i32(stepH); k >= -i32(stepH); k--) {
      let yy = pos.y + f32(k);
      if(yy < 0.0) { break; }
      if(solidAt(vec3<f32>(pos.x, yy, pos.z)) && !solidAt(vec3<f32>(pos.x, yy + 1.0, pos.z))) {
        ground = floor(yy) + 1.0;
        break;
      }
    }
    let ny = pos.y + p.vel.y * cfg.dt;
    if(ground >= 0.0 && ny <= ground) {
      pos.y = ground;
      p.vel.y = 0.0;
      if((u32(inp.shoot + 0.5) & 2u) != 0u) { p.vel.y = 9.9 * SCALE; }
    } else {
      pos.y = ny;
    }
  }
  if(pos.y < 1.0) { pos.y = 1.0; p.vel.y = 0.0; }
  pos.x = clamp(pos.x, -ARENA * 0.5, ARENA * 0.5);
  pos.z = clamp(pos.z, -ARENA * 0.5, ARENA * 0.5);
  p.pos = pos;
  players[i] = p;

  let slot = (cfg.tick % cfg.hist) * cfg.players + i;
  hist[slot] = vec4<f32>(p.pos, p.yaw);

  let cell = vec3<u32>(
    u32(clamp((p.pos.x + WORLD * 0.5) / CELL_W, 0.0, 63.0)),
    u32(clamp(p.pos.y / CELL_W, 0.0, 63.0)),
    u32(clamp((p.pos.z + WORLD * 0.5) / CELL_W, 0.0, 63.0)));
  cellOf[i] = cell.x | (cell.y << 8u) | (cell.z << 16u);
}

@compute @workgroup_size(8, 8)
fn cell_visibility(@builtin(global_invocation_id) gid: vec3<u32>) {
  let a = gid.x;
  let b = gid.y;
  if(a >= cfg.cells || b >= cfg.cells || a > b) { return; }
  var vis = 0u;
  if(a == b) {
    vis = 1u;
  } else {
    let pa = cellAnchor[a].xyz + vec3<f32>(0.0, 1.6 * SCALE, 0.0);
    let ancB = cellAnchor[b].xyz;
    let flat = normalize(vec3<f32>(ancB.z - pa.z, 0.0, pa.x - ancB.x));
    for(var k = 0u; k < 5u && vis == 0u; k++) {
      var aim = ancB;
      if(k == 0u) { aim += vec3<f32>(0.0, 1.7 * SCALE, 0.0); }
      else if(k == 1u) { aim += vec3<f32>(0.0, 1.0 * SCALE, 0.0); }
      else if(k == 2u) { aim += vec3<f32>(0.0, 0.3 * SCALE, 0.0); }
      else if(k == 3u) { aim += vec3<f32>(0.0, 1.3 * SCALE, 0.0) + flat * CELL_W * 0.2; }
      else { aim += vec3<f32>(0.0, 1.3 * SCALE, 0.0) - flat * CELL_W * 0.2; }
      let d = aim - pa;
      let dist = length(d);
      if(dist < 1.0) { vis = 1u; break; }
      if(!blocked(pa, d / dist, dist)) { vis = 1u; }
    }
  }
  cellVis[a * cfg.cells + b] = vis;
  cellVis[b * cfg.cells + a] = vis;
}

@compute @workgroup_size(8, 8)
fn visibility(@builtin(global_invocation_id) gid: vec3<u32>) {
  let a = gid.x;
  let b = gid.y;
  if(a >= cfg.players || b >= cfg.players || a >= b) { return; }
  let pa = players[a].pos + vec3<f32>(0.0, 1.6 * SCALE, 0.0);
  let base = players[b].pos;
  let flat = normalize(vec3<f32>(base.z - pa.z, 0.0, pa.x - base.x));
  var seen = false;
  for(var k = 0u; k < 5u && !seen; k++) {
    var aim = base;
    if(k == 0u) { aim += vec3<f32>(0.0, 1.7 * SCALE, 0.0); }
    else if(k == 1u) { aim += vec3<f32>(0.0, 1.0 * SCALE, 0.0); }
    else if(k == 2u) { aim += vec3<f32>(0.0, 0.3 * SCALE, 0.0); }
    else if(k == 3u) { aim += vec3<f32>(0.0, 1.3 * SCALE, 0.0) + flat * 0.3 * SCALE; }
    else { aim += vec3<f32>(0.0, 1.3 * SCALE, 0.0) - flat * 0.3 * SCALE; }
    let d = aim - pa;
    let dist = length(d);
    if(dist > 220.0) { return; }
    if(!blocked(pa, d / dist, dist)) { seen = true; }
  }
  if(!seen) { return; }
  let na = atomicAdd(&visCount[a], 1u);
  if(na < cfg.maxVis) { visList[a * cfg.maxVis + na] = b; }
  let nb = atomicAdd(&visCount[b], 1u);
  if(nb < cfg.maxVis) { visList[b * cfg.maxVis + nb] = a; }
}

@compute @workgroup_size(64)
fn fly_bullets(@builtin(global_invocation_id) gid: vec3<u32>) {
  let i = gid.x;
  if(i * 2u + 1u >= arrayLength(&bullets)) { return; }
  var b0 = bullets[i * 2u];
  var b1 = bullets[i * 2u + 1u];
  if(b1.w < 0.5) { return; }
  let packed = u32(b0.w + 0.5);
  let shooter = packed & 1023u;
  let delay = min(packed >> 10u, cfg.hist - 2u);

  var pos = b0.xyz;
  let step = b1.xyz * cfg.dt;
  let sub = max(1u, u32(ceil(length(step) / 2.0)));
  var dead = false;
  for(var s = 0u; s < sub && !dead; s++) {
    pos += step / f32(sub);
    if(solidAt(pos)) {
      let c = atomicAdd(&hitCount[1], 1u);
      if(c < arrayLength(&craterReq)) { craterReq[c] = vec4<f32>(pos, 6.0); }
      dead = true;
      break;
    }
    for(var j = 0u; j < cfg.players; j++) {
      if(j == shooter) { continue; }
      if(players[j].hp < 0.5) { continue; }
      let t = hist[((cfg.tick + cfg.hist - delay) % cfg.hist) * cfg.players + j].xyz;
      let dh = vec2<f32>(pos.x - t.x, pos.z - t.z);
      if(dot(dh, dh) < BULLET_R * BULLET_R && pos.y > t.y && pos.y < t.y + 1.9 * SCALE) {
        let n = atomicAdd(&hitCount[0], 1u);
        if(n < arrayLength(&hits)) { hits[n] = Hit(shooter, j, 0.0, cfg.tick); }
        dead = true;
        break;
      }
    }
  }
  bullets[i * 2u] = vec4<f32>(pos, b0.w);
  bullets[i * 2u + 1u] = vec4<f32>(b1.xyz, select(b1.w - 1.0, 0.0, dead));
}

@compute @workgroup_size(64)
fn carve_craters(@builtin(global_invocation_id) gid: vec3<u32>) {
  let n = min(atomicLoad(&hitCount[1]), arrayLength(&craterReq));
  if(gid.y >= n) { return; }
  let c = craterReq[gid.y];
  let rad = i32(round(c.w));
  let side = 2 * rad + 1;
  if(i32(gid.x) >= side * side) { return; }
  let dx = i32(gid.x) % side - rad;
  let dz = i32(gid.x) / side - rad;
  let x = i32(round(c.x)) + i32(WORLD) / 2 + dx;
  let z = i32(round(c.z)) + i32(WORLD) / 2 + dz;
  if(x < 0 || z < 0 || x >= i32(WORLD) || z >= i32(WORLD)) { return; }
  let cy = i32(round(c.y));
  let col = u32(z * i32(WORLD) + x) * 8u;
  for(var dy = -rad; dy <= rad; dy++) {
    if(dx * dx + dy * dy + dz * dz > rad * rad) { continue; }
    let y = cy + dy;
    if(y < 0 || y >= i32(NY)) { continue; }
    atomicAnd(&worldBits[col + u32(y >> 5)], ~(1u << u32(y & 31)));
  }
}
</script>
<script type="module">
import { Pane } from 'https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js';

// ─────────────────────────── SETTINGS ───────────────────────────
const SCALE = 10;
const M = (metres) => metres * SCALE;

const N = 1024;
const NY = 256;
const CELL = 8;
const CHUNK = 32;
const BLOCK = 1;
const GROUND = M(9);
const HILLS = M(4);
const ISLE_Y = M(17);
const ISLE_SIZE = M(6);
const ISLE_AMOUNT = 0.7;
const LOAD_BUDGET_MS = 3;
const SEED = 7;

const MOVE_SPEED = M(4.5);
const RUN_MULT = 1.9;
const JUMP_V = M(9.9);
const GRAVITY = M(26);
const EYE = M(1.62);
const PLAYER_R = M(0.32);
const STEP_H = Math.round(M(0.6));
const MOUSE_SENS = 0.0022;
const REACH = M(45);

const SUN = [0.42, 0.82, 0.38];
const SUN_COLOR = [255, 246, 214];
const SUN_COS = 0.9985;
const SUN_GLOW = 0.96;
const FOG = { color: { r: 150, g: 170, b: 195 } };
const SKY_TOP = [92, 132, 196];
const SKY_HOR = [186, 206, 226];

let DIG_R = 12;
let DOF_START = 0.21;
let DOF_END = 1.0;
let DOF_R = 5;
let RES_H = 280;
let FOV_DEG = 70;
let MAX_DIST = N / 2;
let FOG_START = 0.49;
let FOG_END = 0.8;
let AMBIENT = 0.42;
let SHADOW = true;
let SHADOW_DIST = 84;
let SHADOW_DARK = 0.5;
let SHADOW_LOD = 0;
let AO = true;
let AO_STRENGTH = 0.6;

// ─────────────────────────── WORLD ───────────────────────────
const LMAX = Math.log2(Math.min(N, NY)) | 0;
const CL = Math.log2(CELL) | 0, CM = CELL - 1, CELL3 = CELL ** 3;
const NC = N / CELL, NCY = NY / CELL;
const lv = Array.from({ length: LMAX + 1 }, (_, L) => (L > CL ? new Uint8Array((N >> L) * (NY >> L) * (N >> L)) : null));
let wox = -(N >> 1), woz = -(N >> 1);

const pyrBytes = lv.reduce((s, a) => s + (a ? a.byteLength : 0), 0);
const cellB = new Int32Array(NC * NCY * NC).fill(-1);
let blocks = new Uint8Array(CELL3 * 64);
let blockCount = 0;
const freeB = [];

const cellAt = (x, y, z) => ((z >> CL) * NCY + (y >> CL)) * NC + (x >> CL);
const inCell = (x, y, z) => ((z & CM) * CELL + (y & CM)) * CELL + (x & CM);
const inBox = (x, y, z) => (x | y | z) >= 0 && x < N && y < NY && z < N;

const dirtyBlocks = new Set();
let dirtyCells = true, dirtyPyr = true;

const uniType = (b) => -b - 2;
const uniCode = (t) => -t - 2;

const blockCell = new Int32Array(65536).fill(-1);

const allocCell = (c, fill) => {
  dirtyCells = true;
  const b = freeB.length ? freeB.pop() : blockCount++;
  if((b + 1) * CELL3 > blocks.length) {
    const grown = new Uint8Array(blocks.length * 2);
    grown.set(blocks);
    blocks = grown;
  }
  blocks.fill(fill, b * CELL3, (b + 1) * CELL3);
  if(b < blockCell.length) blockCell[b] = c;
  dirtyBlocks.add(b);
  return cellB[c] = b;
};

const voxAt = (x, y, z) => {
  const b = cellB[cellAt(x, y, z)];
  if(b >= 0) return blocks[b * CELL3 + inCell(x, y, z)];
  return b === -1 ? 0 : uniType(b);
};
const voxSet = (x, y, z, t) => {
  const c = cellAt(x, y, z);
  let b = cellB[c];
  if(b < 0) {
    const was = b === -1 ? 0 : uniType(b);
    if(was === t) return;
    b = allocCell(c, was);
  }
  blocks[b * CELL3 + inCell(x, y, z)] = t;
  dirtyBlocks.add(b);
};

const compact = () => {
  for(const b of dirtyBlocks) {
    const c = b < blockCell.length ? blockCell[b] : -1;
    if(c < 0 || cellB[c] !== b) continue;
    const o = b * CELL3, v = blocks[o];
    let same = true;
    for(let i = 1; i < CELL3; i++) if(blocks[o + i] !== v) { same = false; break; }
    if(!same) continue;
    cellB[c] = v === 0 ? -1 : uniCode(v);
    blockCell[b] = -1;
    freeB.push(b);
    dirtyBlocks.delete(b);
    dirtyCells = true;
  }
};
const getVox = (x, y, z) => inBox(x, y, z) ? voxAt(x, y, z) : 0;

const reduceBox = (x0, y0, z0, x1, y1, z1) => {
  dirtyPyr = true;
  x0 = Math.max(0, x0); y0 = Math.max(0, y0); z0 = Math.max(0, z0);
  x1 = Math.min(N - 1, x1); y1 = Math.min(NY - 1, y1); z1 = Math.min(N - 1, z1);
  for(let L = CL + 1; L <= LMAX; L++) {
    const nx = N >> L, ny = NY >> L;
    const cx = N >> (L - 1), cyy = NY >> (L - 1);
    const d = lv[L - 1];
    const sy = cx, sz = cx * cyy;
    for(let z = z0 >> L; z <= z1 >> L; z++) for(let y = y0 >> L; y <= y1 >> L; y++) for(let x = x0 >> L; x <= x1 >> L; x++) {

  const o = AC.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
};

    const t = AC.currentTime;
    const nb = AC.createBuffer(1, 6000, AC.sampleRate);
    const d = nb.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / 700);
    const src = AC.createBufferSource();
    src.buffer = nb;
    const f = AC.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(4500, t);

const handleSnapshot = (data) => {

  if(v.getUint8(0) !== 2) return;
  {
    const seq = v.getUint32(1, true);
    if(seq <= net.seq) return;
    net.seq = seq;
    net.ticks.push([seq, performance.now()]);
    if(net.ticks.length > 16) net.ticks.shift();
    net.ack = v.getUint32(5, true);
    net.selfVy = v.getFloat32(9, true);
    const n = Math.min(v.getUint16(13, true), MAX_BODIES);
    const now = performance.now();
    for(let i = 0; i < n; i++) {
      const o = 15 + i * 18;
      const id = v.getUint16(o, true);
      const x = v.getFloat32(o + 2, true), y = v.getFloat32(o + 6, true), z = v.getFloat32(o + 10, true);
      const yaw = v.getFloat32(o + 14, true);
      if(id === 0) { net.self = { x, y, z, yaw }; net.fresh = true; continue; }
      const b = net.seen.get(id);
      if(b) { b.px = b.tx; b.py = b.ty; b.pz = b.tz; b.pt = b.tt; b.tx = x; b.ty = y; b.tz = z; b.tt = now; b.yaw = yaw; }

    const events = v.getUint16(eo, true);
    eo += 2;
    for(let i = 0; i < events; i++) {
      const shooter = v.getUint16(eo, true);
      const victim = v.getUint16(eo + 2, true);

      if(shooter === 0) { hitFlash(); sfx.hit(); sfx.kill(); }
      const dead = net.seen.get(victim);

    const shots = v.getUint16(eo, true);

      const shooter = v.getUint16(eo, true);
      const ox = v.getFloat32(eo + 2, true), oy = v.getFloat32(eo + 6, true), oz = v.getFloat32(eo + 10, true);

      eo += 16;
      const tc = performance.now();
      addCrater(hx, hy, hz, hr);
      perf.crater += performance.now() - tc;
    }
  }
};

struct U {

@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var<storage, read> cells: array<i32>;
@group(0) @binding(2) var<storage, read> blocks: array<u32>;
@group(0) @binding(3) var<storage, read> pyr: array<u32>;
@group(0) @binding(4) var<storage, read> pal: array<vec4<f32>>;
@group(0) @binding(5) var<storage, read> bodies: array<vec4<f32>>;
@group(0) @binding(6) var<storage, read> tracers: array<vec4<f32>>;

fn tracerGlow(o: vec3<f32>, d: vec3<f32>, sceneT: f32) -> vec3<f32> {
  var glow = vec3<f32>(0.0);
  let cnt = u32(u.opts2.y);
  for(var i = 0u; i < cnt; i++) {
    let head = tracers[i * 2u].xyz;
    let tail = tracers[i * 2u + 1u].xyz;
    let seg = head - tail;
    let segLen = length(seg);
    if(segLen < 0.5) { continue; }
    let sd = seg / segLen;
    let w = o - tail;
    let a = dot(d, d);
    let bb = dot(d, sd);
    let cc = dot(sd, sd);
    let dd = dot(d, w);
    let ee = dot(sd, w);
    let den = a * cc - bb * bb;
    var tRay = 0.0;
    var tSeg = 0.0;
    if(abs(den) > 1e-6) {
      tRay = (bb * ee - cc * dd) / den;
      tSeg = (a * ee - bb * dd) / den;
    }
    tSeg = clamp(tSeg, 0.0, segLen);
    tRay = clamp(tRay, 0.0, sceneT);
    let pRay = o + d * tRay;
    let pSeg = tail + sd * tSeg;
    let dist = length(pRay - pSeg);
    let k = tSeg / segLen;
    let core = exp(-dist * dist * 6.0);
    let halo = exp(-dist * dist * 0.8) * 0.15;
    glow += vec3<f32>(1.0, 0.85, 0.5) * (core + halo) * (0.2 + 0.8 * k);
  }
  return glow;
}

struct BodyHit { hit: bool, t: f32, n: vec3<f32>, col: vec3<f32> };

fn hitBodies(o: vec3<f32>, d: vec3<f32>, maxT: f32) -> BodyHit {
  var out: BodyHit;
  out.hit = false;
  out.t = maxT;
  let count = u32(u.opts2.x);
  let half = vec3<f32>(0.35, 0.9, 0.35) * ${SCALE}.0;
  for(var i = 0u; i < count; i++) {
    let b = bodies[i];
    let c = b.xyz + vec3<f32>(0.0, half.y, 0.0);
    let inv = 1.0 / d;
    let t1 = (c - half - o) * inv;
    let t2 = (c + half - o) * inv;
    let lo = min(t1, t2);
    let hi = max(t1, t2);
    let tn = max(max(lo.x, lo.y), lo.z);
    let tf = min(min(hi.x, hi.y), hi.z);
    if(tf < tn || tf < 0.0 || tn > out.t) { continue; }
    out.hit = true;
    out.t = max(tn, 0.0);
    let p = o + d * out.t - c;
    let a = abs(p) / half;
    if(a.x > a.y && a.x > a.z) { out.n = vec3<f32>(sign(p.x), 0.0, 0.0); }
    else if(a.y > a.z) { out.n = vec3<f32>(0.0, sign(p.y), 0.0); }
    else { out.n = vec3<f32>(0.0, 0.0, sign(p.z)); }
    let hue = fract(b.w * 0.618034);
    let rgb = clamp(abs(fract(vec3<f32>(hue) + vec3<f32>(0.0, 0.6667, 0.3333)) * 6.0 - 3.0) - 1.0, vec3<f32>(0.0), vec3<f32>(1.0));
    out.col = mix(vec3<f32>(0.5), rgb, 0.65) * 0.9;
  }
  return out;
}

fn outside(p: vec3<i32>) -> bool {
  return p.x < 0 || p.y < 0 || p.z < 0 || p.x >= N || p.y >= NY || p.z >= N;
}

fn cellIdx(p: vec3<i32>) -> i32 {
  return ((p.z >> CL) * NCY + (p.y >> CL)) * NC + (p.x >> CL);
}

fn voxAt(p: vec3<i32>) -> u32 {
  if(outside(p)) { return 0u; }
  let b = cells[cellIdx(p)];
  if(b == -1) { return 0u; }
  if(b < -1) { return u32(-b - 2); }
  if(u32(b) >= MAX_BLOCKS) { return 0u; }
  let i = u32(b) * CELL3 + u32(((p.z & CM) * CELL + (p.y & CM)) * CELL + (p.x & CM));
  return ((blocks[i >> 2u] >> ((i & 3u) * 8u)) & 0xffu);
}

fn nodeAt(L: u32, p: vec3<i32>) -> u32 {
  if(L == CL) { return select(1u, 0u, cells[cellIdx(p)] == -1); }
  let nx = N >> L;
  let ny = NY >> L;
  let i = PYR_OFF[L] + u32(((p.z >> L) * ny + (p.y >> L)) * nx + (p.x >> L));
  return (pyr[i >> 2u] >> ((i & 3u) * 8u)) & 0xffu;
}

fn exitFast(o: vec3<f32>, inv: vec3<f32>, size: i32, node: vec3<i32>) -> vec2<f32> {
  let b = vec3<f32>(node * size);
  var t = vec3<f32>(1e30);
  let far = b + vec3<f32>(f32(size));
  if(inv.x > 0.0) { t.x = (far.x - o.x) * inv.x; } else if(inv.x < 0.0) { t.x = (b.x - o.x) * inv.x; }
  if(inv.y > 0.0) { t.y = (far.y - o.y) * inv.y; } else if(inv.y < 0.0) { t.y = (b.y - o.y) * inv.y; }
  if(inv.z > 0.0) { t.z = (far.z - o.z) * inv.z; } else if(inv.z < 0.0) { t.z = (b.z - o.z) * inv.z; }
  var best = t.x; var axis = 0.0;
  if(t.y < best) { best = t.y; axis = 1.0; }
  if(t.z < best) { best = t.z; axis = 2.0; }
  return vec2<f32>(best, axis);
}

fn clipBox(o: vec3<f32>, d: vec3<f32>) -> vec2<f32> {
  var t0 = 0.0;
  var t1 = 1e9;
  let ext = vec3<f32>(f32(N), f32(NY), f32(N));
  for(var k = 0u; k < 3u; k++) {
    let oc = o[k]; let dc = d[k];
    if(abs(dc) < 1e-12) {
      if(oc < 0.0 || oc > ext[k]) { return vec2<f32>(1.0, 0.0); }
    } else {
      var a = -oc / dc; var b = (ext[k] - oc) / dc;
      if(a > b) { let q = a; a = b; b = q; }
      t0 = max(t0, a); t1 = min(t1, b);
    }
  }
  return vec2<f32>(max(t0, 0.0), t1);
}

struct Hit { hit: bool, t: f32, v: vec3<i32>, axis: i32, kind: u32 };

fn snapHit(o: vec3<f32>, inv: vec3<f32>, d: vec3<f32>, start: vec3<i32>, t0: f32) -> Hit {
  var v = start;
  var out: Hit;
  out.hit = true; out.t = t0; out.v = v; out.axis = 0; out.kind = 0u;
  for(var k = 0; k < 4; k++) {
    var tb = -1e30; var axis = 0;
    if(inv.x != 0.0) { tb = (f32(select(v.x + 1, v.x, inv.x > 0.0)) - o.x) * inv.x; }
    if(inv.y != 0.0) { let ty = (f32(select(v.y + 1, v.y, inv.y > 0.0)) - o.y) * inv.y; if(ty > tb) { tb = ty; axis = 1; } }
    if(inv.z != 0.0) { let tz = (f32(select(v.z + 1, v.z, inv.z > 0.0)) - o.z) * inv.z; if(tz > tb) { tb = tz; axis = 2; } }
    out.axis = axis;
    if(tb <= t0 + 1e-9) { out.t = t0; break; }
    out.t = tb;
    var n = v;
    if(axis == 0) { n.x = v.x - select(-1, 1, inv.x > 0.0); }
    else if(axis == 1) { n.y = v.y - select(-1, 1, inv.y > 0.0); }
    else { n.z = v.z - select(-1, 1, inv.z > 0.0); }
    if(outside(n)) { break; }
    if(voxAt(n) == 0u) { break; }
    v = n;
  }
  out.v = v;
  return out;
}

fn trace(o: vec3<f32>, d: vec3<f32>, tMax: f32, stopL: u32) -> Hit {
  var out: Hit;
  out.hit = false; out.t = 0.0; out.v = vec3<i32>(0); out.axis = 0; out.kind = 0u;
  let clip = clipBox(o, d);
  if(clip.y <= clip.x) { return out; }
  var t = clip.x;
  let t1 = min(clip.y, tMax);
  let inv = vec3<f32>(
    select(0.0, 1.0 / d.x, d.x != 0.0),
    select(0.0, 1.0 / d.y, d.y != 0.0),
    select(0.0, 1.0 / d.z, d.z != 0.0));
  var L = LMAX;
  var axis = 0.0;
  for(var guard = 0; guard < 4096 && t < t1; guard++) {
    let eps = max(EPS, t * 1e-5);
    let p = o + d * (t + eps);
    if(any(p < vec3<f32>(0.0)) || any(p >= vec3<f32>(f32(N), f32(NY), f32(N)))) { break; }
    let ip = vec3<i32>(p);
    var v = 0u;
    loop {
      if(L == 0u) { v = voxAt(ip); break; }
      v = nodeAt(L, ip);
      if(v == 0u || L == stopL) { break; }
      L = select(L - 1u, 0u, L == PYR_BASE);
    }
    if(v == 0u) {
      let e = exitFast(o, inv, i32(1u << L), ip >> vec3<u32>(L));
      t = max(e.x, t) + eps;
      axis = e.y;
      L = select(min(LMAX, L + 1u), PYR_BASE, L == 0u);
      continue;
    }
    if(stopL > 0u) { out.hit = true; out.t = t; return out; }
    var h = snapHit(o, inv, d, ip, clip.x);
    h.kind = voxAt(h.v);
    return h;
  }
  return out;
}

fn occAt(p: vec3<i32>) -> f32 { return select(0.0, 1.0, voxAt(p) != 0u); }
fn vAO(s1: f32, s2: f32, c: f32) -> f32 { return select(3.0 - (s1 + s2 + c), 0.0, s1 > 0.0 && s2 > 0.0); }

fn voxAO(pos: vec3<f32>, n: vec3<f32>) -> f32 {
  let v = vec3<i32>(floor(pos - n * 0.5));
  let b = v + vec3<i32>(n);
  var uu: vec3<i32>; var ww: vec3<i32>; var f: vec2<f32>;
  let fp = pos - vec3<f32>(v);
  if(n.x != 0.0) { uu = vec3<i32>(0, 1, 0); ww = vec3<i32>(0, 0, 1); f = vec2<f32>(fp.y, fp.z); }
  else if(n.y != 0.0) { uu = vec3<i32>(1, 0, 0); ww = vec3<i32>(0, 0, 1); f = vec2<f32>(fp.x, fp.z); }
  else { uu = vec3<i32>(1, 0, 0); ww = vec3<i32>(0, 1, 0); f = vec2<f32>(fp.x, fp.y); }
  let sum = occAt(b - uu); let sup = occAt(b + uu);
  let svm = occAt(b - ww); let svp = occAt(b + ww);
  let a00 = vAO(sum, svm, occAt(b - uu - ww));
  let a10 = vAO(sup, svm, occAt(b + uu - ww));
  let a01 = vAO(sum, svp, occAt(b - uu + ww));
  let a11 = vAO(sup, svp, occAt(b + uu + ww));
  let ao = ((a00 * (1.0 - f.x) + a10 * f.x) * (1.0 - f.y) + (a01 * (1.0 - f.x) + a11 * f.x) * f.y) / 3.0;
  return 1.0 - (1.0 - ao) * u.sun.w;
}

fn sky(d: vec3<f32>) -> vec3<f32> {
  let k = clamp(d.y * 1.6 + 0.15, 0.0, 1.0);
  var c = mix(u.skyHor.rgb, u.skyTop.rgb, k);
  c = mix(c, u.fogCol.rgb, max(0.0, 1.0 - abs(d.y) * 6.0));
  let sd = dot(d, u.sun.xyz);
  let disc = select(0.0, 1.0, sd > u.sunCol.w);
  let glow = pow(max(0.0, (sd - u.skyTop.w) / (1.0 - u.skyTop.w)), 4.0);
  return mix(c, u.sunCol.rgb, min(1.0, disc + glow));
}

@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4<f32> {
  var p = array<vec2<f32>, 3>(vec2<f32>(-1.0, -1.0), vec2<f32>(3.0, -1.0), vec2<f32>(-1.0, 3.0));
  return vec4<f32>(p[i], 0.0, 1.0);
}

fn shade(d: vec3<f32>) -> vec4<f32> {
  let o = u.origin.xyz;
  let maxD = u.up.w;

  let h = trace(o, d, maxD, 0u);
  let bh = hitBodies(o, d, select(maxD, h.t, h.hit));
  if(bh.hit) {
    let lam = max(0.0, dot(bh.n, u.sun.xyz));
    let k = u.fwd.w + (1.0 - u.fwd.w) * lam;
    let fog = clamp((bh.t - u.skyHor.w) / (u.fogCol.w - u.skyHor.w), 0.0, 1.0);
    return vec4<f32>(mix(bh.col * k, u.fogCol.rgb, fog), bh.t);
  }
  if(!h.hit) { return vec4<f32>(sky(d) + border(o, d, maxD), maxD); }

  var n = vec3<f32>(0.0);
  if(h.axis == 0) { n.x = select(1.0, -1.0, d.x > 0.0); }
  else if(h.axis == 1) { n.y = select(1.0, -1.0, d.y > 0.0); }
  else { n.z = select(1.0, -1.0, d.z > 0.0); }

  let pos = o + d * h.t;
  let lam = max(0.0, dot(n, u.sun.xyz));
  var k = u.fwd.w + (1.0 - u.fwd.w) * lam;
  k *= select(select(select(0.9, 0.82, n.x != 0.0), 0.62, n.y < 0.0), 1.0, n.y > 0.0);
  if(u.opts.x > 0.5) { k *= voxAO(pos, n); }
  if(u.opts.y > 0.5 && lam > 0.0) {
    let sh = trace(pos + n * 0.03, u.sun.xyz, u.opts.z, u32(u.misc.x));
    if(sh.hit) { k *= u.opts.w; }
  }
  var col = pal[h.kind].rgb * k;
  let fog = clamp((h.t - u.skyHor.w) / (u.fogCol.w - u.skyHor.w), 0.0, 1.0);
  return vec4<f32>(mix(col, u.fogCol.rgb, fog) + border(o, d, h.t), h.t);
}

fn border(o: vec3<f32>, d: vec3<f32>, sceneT: f32) -> vec3<f32> {
  var glow = 0.0;
  for(var k = 0u; k < 4u; k++) {
    var plane = u.arena.x;
    if(k == 1u) { plane = u.arena.y; }
    var t = 0.0;
    if(k < 2u) {
      if(abs(d.x) < 1e-5) { continue; }
      t = (plane - o.x) / d.x;
    } else {
      plane = select(u.arena.w, u.arena.z, k == 2u);
      if(abs(d.z) < 1e-5) { continue; }
      t = (plane - o.z) / d.z;
    }
    if(t < 0.5 || t > sceneT) { continue; }
    let p = o + d * t;
    if(p.y < 0.0 || p.y > 200.0) { continue; }
    if(k < 2u) { if(p.z < u.arena.z || p.z > u.arena.w) { continue; } }
    else { if(p.x < u.arena.x || p.x > u.arena.y) { continue; } }
    let stripe = smoothstep(0.8, 1.0, abs(fract(p.y / 24.0) * 2.0 - 1.0));
    glow += (0.08 + 0.25 * stripe) * exp(-p.y * 0.004);
  }
  return vec3<f32>(1.0, 0.45, 0.4) * glow;
}

@fragment fn fs(@builtin(position) frag: vec4<f32>) -> @location(0) vec4<f32> {
  let fov = u.origin.w;
  let uu = (2.0 * frag.x / u.misc.y - 1.0) * fov * u.right.w;
  let vv = (1.0 - 2.0 * frag.y / u.misc.z) * fov;
  return shade(normalize(u.right.xyz * uu + u.up.xyz * vv + u.fwd.xyz));
}

@group(0) @binding(1) var frame: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;

@fragment fn fsBlur(@builtin(position) frag: vec4<f32>) -> @location(0) vec4<f32> {
  let res = vec2<f32>(u.misc.y, u.misc.z);
  let uv = frag.xy / res;
  let here = textureSampleLevel(frame, samp, uv, 0.0);
  let k = clamp((here.a - u.dof.x) / max(1.0, u.dof.y - u.dof.x), 0.0, 1.0);
  let r = k * k * u.dof.z;
  var col = here.rgb;
  if(r >= 0.4) {
    var sum = here.rgb;
    var wsum = 1.0;
    for(var i = 0u; i < 8u; i++) {
      let a = (f32(i) + 0.5) * 0.7853982;
      let dir = vec2<f32>(cos(a), sin(a));
      for(var ring = 1u; ring <= 2u; ring++) {
        let off = dir * r * (0.5 * f32(ring));
        let s = textureSampleLevel(frame, samp, uv + off / res, 0.0);
        let w = select(0.0, 1.0, s.a > here.a - r);
        sum += s.rgb * w;
        wsum += w;
      }
    }
    col = sum / wsum;
  }
  let fov = u.origin.w;
  let uu = (2.0 * frag.x / u.misc.y - 1.0) * fov * u.right.w;
  let vv = (1.0 - 2.0 * frag.y / u.misc.z) * fov;
  let d = normalize(u.right.xyz * uu + u.up.xyz * vv + u.fwd.xyz);
  col += tracerGlow(u.origin.xyz, d, here.a);
  return vec4<f32>(col, 1.0);
}
`;

  const module = device.createShaderModule({ code });
  const SCENE = 'rgba16float';
  const pipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module, entryPoint: 'vs' },
    fragment: { module, entryPoint: 'fs', targets: [{ format: SCENE }] },
    primitive: { topology: 'triangle-list' },
  });
  const blurPipe = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module, entryPoint: 'vs' },
    fragment: { module, entryPoint: 'fsBlur', targets: [{ format }] },
    primitive: { topology: 'triangle-list' },
  });
  const sampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear' });
  const bind = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: uniBuf } },
      { binding: 1, resource: { buffer: cellBuf } },
      { binding: 2, resource: { buffer: blockBuf } },
      { binding: 3, resource: { buffer: pyrBuf } },
      { binding: 4, resource: { buffer: palBuf } },
      { binding: 5, resource: { buffer: bodyBuf } },
    ],
  });
  return { device, ctx, pipeline, blurPipe, sampler, bind, uniBuf, cellBuf, blockBuf, pyrBuf, bodyBuf, tracerBuf, format, SCENE };
})();

let sceneTex = null, blurBind = null;

const resize = () => {
  RH = RES_H;
  RW = Math.max(1, Math.round(RH * (innerWidth / innerHeight)));
  cv.width = RW; cv.height = RH;
  if(!gpu) return;
  sceneTex?.destroy();
  sceneTex = gpu.device.createTexture({
    size: [RW, RH],
    format: gpu.SCENE,
    usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
  });
  blurBind = gpu.device.createBindGroup({
    layout: gpu.blurPipe.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: gpu.uniBuf } },
      { binding: 1, resource: sceneTex.createView() },
      { binding: 2, resource: gpu.sampler },
      { binding: 6, resource: { buffer: gpu.tracerBuf } },
    ],
  });
};

const uni = new Float32Array(56);

const upload = () => {
  compact();
  const q = gpu.device.queue;
  for(const b of dirtyBlocks) {
    if(b >= MAX_BLOCKS) { if(!upload.warned) { upload.warned = true; console.warn('block pool overflow: raise MAX_BLOCKS'); } continue; }
    q.writeBuffer(gpu.blockBuf, b * CELL3, blocks, b * CELL3, CELL3);
  }
  dirtyBlocks.clear();
  if(dirtyCells) { q.writeBuffer(gpu.cellBuf, 0, cellB); dirtyCells = false; }
  if(dirtyPyr) {
    for(let L = CL + 1; L <= LMAX; L++) pyrPack.set(lv[L], pyrOff[L]);
    q.writeBuffer(gpu.pyrBuf, 0, pyrPack);
    dirtyPyr = false;
  }
};

const render = () => {
  if(!gpu) return;
  const fov = Math.tan(FOV_DEG * Math.PI / 360);
  const cy = Math.cos(P.yaw), sy = Math.sin(P.yaw), cp = Math.cos(P.pitch), sp = Math.sin(P.pitch);
  const sl = Math.hypot(SUN[0], SUN[1], SUN[2]);
  uni.set([P.x + P.ex, P.y + P.ey + EYE - P.lag, P.z + P.ez, fov], 0);
  uni.set([cy, 0, -sy, RW / RH], 4);
  uni.set([-sp * sy, cp, -sp * cy, MAX_DIST], 8);
  uni.set([cp * sy, sp, cp * cy, AMBIENT], 12);
  uni.set([SUN[0] / sl, SUN[1] / sl, SUN[2] / sl, AO_STRENGTH], 16);
  uni.set([SUN_COLOR[0] / 255, SUN_COLOR[1] / 255, SUN_COLOR[2] / 255, SUN_COS], 20);
  uni.set([SKY_TOP[0] / 255, SKY_TOP[1] / 255, SKY_TOP[2] / 255, SUN_GLOW], 24);
  uni.set([SKY_HOR[0] / 255, SKY_HOR[1] / 255, SKY_HOR[2] / 255, MAX_DIST * FOG_START], 28);
  uni.set([FOG.color.r / 255, FOG.color.g / 255, FOG.color.b / 255, MAX_DIST * FOG_END], 32);
  uni.set([AO ? 1 : 0, SHADOW ? 1 : 0, SHADOW_DIST, SHADOW_DARK], 36);
  uni.set([SHADOW_LOD > 0 ? PYR_BASE : 0, RW, RH, 0], 40);
  uni.set([MAX_DIST * DOF_START, MAX_DIST * DOF_END, DOF_R, 0], 44);
  const now = performance.now() - INTERP_LAG;
  let w = 0;
  for(const [id, b] of net.seen) {
    if(now - b.tt > BODY_KEEP) { net.seen.delete(id); continue; }
    const span = Math.max(1, b.tt - b.pt);
    const k = Math.max(0, Math.min(1.6, (now - b.pt) / span));
    net.bodies.set([
      b.px + (b.tx - b.px) * k - wox,
      b.py + (b.ty - b.py) * k,
      b.pz + (b.tz - b.pz) * k - woz,
      id,
    ], w * 4);
    if(++w >= MAX_BODIES) break;
  }
  net.count = w;
  if(w) gpu.device.queue.writeBuffer(gpu.bodyBuf, 0, net.bodies, 0, w * 4);

  const tnow = performance.now();
  let tc = 0;
  const tr = new Float32Array(64 * 8);
  for(let i = liveBullets.length - 1; i >= 0; i--) {
    const b = liveBullets[i];
    const flew = (tnow - b.born) / 1000 * BULLET_SPEED;
    if(flew - TRACER_LEN > b.wall || flew > 700) { liveBullets.splice(i, 1); continue; }
    const headT = Math.min(flew, b.wall);
    const tailT = Math.max(0, flew - TRACER_LEN);
    if(tc < 64) {
      tr.set([b.x + b.dx * headT, b.y + b.dy * headT, b.z + b.dz * headT, 0,
              b.x + b.dx * tailT, b.y + b.dy * tailT, b.z + b.dz * tailT, 0], tc * 8);
      tc++;
    }
  }
  if(tc) gpu.device.queue.writeBuffer(gpu.tracerBuf, 0, tr, 0, tc * 8);
  uni.set([net.count, tc, 0, 0], 48);
  uni.set([-448 - wox, 448 - wox, -448 - woz, 448 - woz], 52);
  gpu.device.queue.writeBuffer(gpu.uniBuf, 0, uni);

  upload();

  const enc = gpu.device.createCommandEncoder();
  const draw = (pipe, bind, view) => {
    const pass = enc.beginRenderPass({
      colorAttachments: [{ view, loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }],
    });
    pass.setPipeline(pipe);
    pass.setBindGroup(0, bind);
    pass.draw(3);
    pass.end();
  };
  draw(gpu.pipeline, gpu.bind, sceneTex.createView());
  draw(gpu.blurPipe, blurBind, gpu.ctx.getCurrentTexture().createView());
  gpu.device.queue.submit([enc.finish()]);
};

(async () => {
  addEventListener('keydown', (e) => {
    keys.add(e.code);
    if(e.code === 'Space') e.preventDefault();
    const n = e.code.startsWith('Digit') ? Number(e.code.slice(5)) : 0;
    if(n >= 1 && n <= MATS) P.mat = n - 1;
  });
  addEventListener('keyup', (e) => keys.delete(e.code));
  cv.addEventListener('click', () => { if(document.pointerLockElement !== cv) cv.requestPointerLock(); });
  addEventListener('mousemove', (e) => {
    if(document.pointerLockElement !== cv) return;
    P.yaw += e.movementX * MOUSE_SENS;
    P.pitch = Math.max(-1.5, Math.min(1.5, P.pitch - e.movementY * MOUSE_SENS));
  });
  addEventListener('contextmenu', (e) => e.preventDefault());
  addEventListener('resize', resize);

  const hud = document.getElementById('hud');

  const REDUN = 3;
  const inBuf = new ArrayBuffer(2 + REDUN * 28);
  const inView = new DataView(inBuf);
  inView.setUint8(0, 1);
  const sentRing = [];
  let shoot = 0, dig = 0;
  addEventListener('mousedown', (e) => {
    if(document.pointerLockElement !== cv) return;
    if(e.button === 2) dig = 1; else shoot = 1;
  });
  const sendInput = (dt) => {
    if(!net.ws || net.ws.readyState !== 'open') return null;
    let aim = net.seq - 4;
    const shown = performance.now() - INTERP_LAG;
    for(let i = net.ticks.length - 1; i > 0; i--) {
      const [tB, atB] = net.ticks[i], [tA, atA] = net.ticks[i - 1];
      if(shown >= atA && shown <= atB) { aim = tA + (tB - tA) * (shown - atA) / (atB - atA); break; }
    }
    const inp = {
      seq: ++net.inSeq,
      dt,
      fx: (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0),
      fz: (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0),
      yaw: P.yaw,
      pitch: P.pitch,
      jump: keys.has('Space'),
      buttons: shoot + (keys.has('Space') ? 2 : 0) + (keys.has('ShiftLeft') ? 4 : 0) + dig * 8,
      sprint: keys.has('ShiftLeft'),
      aim,
    };
    if(shoot) {
      const cp = Math.cos(inp.pitch), spp = Math.sin(inp.pitch);
      const vx = cp * Math.sin(inp.yaw), vy = spp, vz = cp * Math.cos(inp.yaw);
      const ex = P.x, ey = P.y + EYE, ez = P.z;
      const tAim = trace(ex, ey, ez, vx, vy, vz, 600) ? st.t : 600;
      const mx = ex + Math.cos(inp.yaw) * 2.5, my = ey - 3, mz = ez - Math.sin(inp.yaw) * 2.5;
      const dx = ex + vx * tAim - mx, dy = ey + vy * tAim - my, dz = ez + vz * tAim - mz;
      const l = Math.hypot(dx, dy, dz) || 1;
      spawnBullet(0, mx, my, mz, dx / l, dy / l, dz / l);
      sfx.shot();
    }
    shoot = 0;
    dig = 0;
    sentRing.push(inp);
    if(sentRing.length > REDUN) sentRing.shift();
    inView.setUint8(1, sentRing.length);
    for(let k = 0; k < sentRing.length; k++) {
      const s = sentRing[k], o = 2 + k * 28;
      inView.setUint32(o, s.seq, true);
      inView.setFloat32(o + 4, s.fx, true);
      inView.setFloat32(o + 8, s.fz, true);
      inView.setFloat32(o + 12, s.yaw, true);
      inView.setFloat32(o + 16, s.buttons, true);
      inView.setFloat32(o + 20, s.pitch, true);
      inView.setFloat32(o + 24, s.aim, true);
    }
    net.ws.send(inBuf);
    globalThis.hostInput = inp;
    if(inp.buttons & 1) globalThis.hostFire = 1;
    if(inp.buttons & 8) globalThis.hostDig = 1;
    return inp;
  };

  let last = performance.now(), fps = 0, hudT = 0, renderMs = 0;
  const frame = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if(dt > 0) fps = fps ? fps * 0.9 + 0.1 / dt : 1 / dt;
    const inp = sendInput(dt);
    if(inp) net.pending.push(inp);
    movePlayer(dt, inp);

    if(net.fresh) {
      net.fresh = false;
      net.pending = net.pending.filter((i) => i.seq > net.ack);
      const was = { x: P.x, y: P.y, z: P.z };
      P.x = net.self.x - wox;
      P.y = net.self.y;
      P.z = net.self.z - woz;
      P.vy = net.selfVy;
      P.onGround = net.selfVy < 5 && collides(P.x, P.y - 0.5, P.z);
      for(const old of net.pending) movePlayer(old.dt, old);
      const ex = was.x - P.x, ey = was.y - P.y, ez = was.z - P.z;
      if(Math.hypot(ex, ey, ez) < SCALE * 2) { P.ex += ex; P.ey += ey; P.ez += ez; }
      followPlayer();
    }
    const soak = Math.exp(-dt * 14);
    P.ex *= soak; P.ey *= soak; P.ez *= soak;
    pumpPending(LOAD_BUDGET_MS);
    const t0 = performance.now();
    render();
    renderMs = renderMs * 0.9 + (performance.now() - t0) * 0.1;
    if(now - hudT > 250) {
      hudT = now;
      hud.textContent =
        `${RW}×${RH} · ${(RW * RH)} rays · world ${N}×${NY}×${N} · ${fps |0 } fps · frame ${renderMs.toFixed(1)} ms\n` +
        `voxels ${(((blockCount - freeB.length) * CELL3 + cellB.byteLength) / 1048576).toFixed(1)} MB · pyramid ${(pyrBytes / 1048576).toFixed(1)} MB\n` +
        `${net.ws ? 'online' : 'offline'} · players from server ${net.count} · rx ${net.kbps.toFixed(0)} KB/s\n`;
      net.kbps = net.kbps * 0.5 + (net.bytes / 256) * 0.5;
      net.bytes = 0;
    }
    requestAnimationFrame(frame);
  };

  const knobs = {
    get RES_H() { return RES_H; }, set RES_H(v) { RES_H = v; },
    get DIG_R() { return DIG_R; }, set DIG_R(v) { DIG_R = v; },
    get DOF_START() { return DOF_START; }, set DOF_START(v) { DOF_START = v; },
    get DOF_END() { return DOF_END; }, set DOF_END(v) { DOF_END = v; },
    get DOF_R() { return DOF_R; }, set DOF_R(v) { DOF_R = v; },
    get FOG_START() { return FOG_START; }, set FOG_START(v) { FOG_START = v; },
    get FOG_END() { return FOG_END; }, set FOG_END(v) { FOG_END = v; },
    get FOV_DEG() { return FOV_DEG; }, set FOV_DEG(v) { FOV_DEG = v; },
    get MAX_DIST() { return MAX_DIST; }, set MAX_DIST(v) { MAX_DIST = v; },
    get SHADOW() { return SHADOW; }, set SHADOW(v) { SHADOW = v; },
    get SHADOW_DIST() { return SHADOW_DIST; }, set SHADOW_DIST(v) { SHADOW_DIST = v; },
    get SHADOW_DARK() { return SHADOW_DARK; }, set SHADOW_DARK(v) { SHADOW_DARK = v; },
    get SHADOW_LOD() { return SHADOW_LOD; }, set SHADOW_LOD(v) { SHADOW_LOD = v; },
  };
  const pane = new Pane({ container: document.getElementById('panel'), title: 'MicroCube' });
  pane.addBinding(knobs, 'RES_H', { label: 'resolution', min: 60, max: 2160, step: 20 }).on('change', resize);
  pane.addBinding(knobs, 'FOV_DEG', { label: 'fov', min: 40, max: 110, step: 1 });
  pane.addBinding(knobs, 'MAX_DIST', { label: 'far', min: 40, max: N / 2, step: 10 });
  pane.addBinding(knobs, 'SHADOW', { label: 'shadows' });
  pane.addBinding(knobs, 'SHADOW_DIST', { label: 'shadow far', min: 8, max: N / 2, step: 8 });
  pane.addBinding(knobs, 'SHADOW_DARK', { label: 'shadow dark', min: 0.1, max: 1, step: 0.05 });

// ─────────────────────────── HOST ───────────────────────────
(async () => {

  const BINDS = ['cfg', 'players', 'inputs', 'hist', 'visCount', 'visList', 'hitCount', 'hits',
    'cellOf', 'cellAnchor', 'cellVis', 'bullets', 'craterReq', 'world', 'world'];

  const guests = new Map();
  let nextSlot = 1;
  const slotPool = [];
  let hostTx = 0;
  const conns = new Set();
  const hostCraterLog = [];
  const hostRunId = (Math.random() * 4294967296) >>> 0;
  const sendJournal = (ch) => {
    let i = 0;
    do {
      const chunk = hostCraterLog.slice(i, i + 3000);
      const dv = new DataView(new ArrayBuffer(13 + chunk.length * 16));
      dv.setUint8(0, 3);
      dv.setUint32(1, hostRunId, true);
      dv.setUint32(5, chunk.length, true);

      ch.send(dv.buffer);

  const wireGuest = (ch, pc) => {

    if(slot >= NP) { pc.close(); return; }

    guests.set(slot, g);

    if(bufs) device.queue.writeBuffer(bufs.players, slot * 32,
      new Float32Array([Math.cos(a) * r, 200, Math.sin(a) * r, 0, 0, 0, 0, 1]));
    ch.onmessage = (e) => {
      g.lastIn = performance.now();
      const v = new DataView(e.data);
      if(v.getUint8(0) !== 1) return;
      const count = v.getUint8(1);
      for(let m = 0; m < count; m++) {
        const o = 2 + m * 28;

  const boot = async () => {

    const B = (size, usage) => device.createBuffer({ size: Math.ceil(size / 4) * 4, usage });
    const ST = GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST;

      cfg: B(32, GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST),

      inputs: B(NP * 32, ST),
      hist: B(HIST * NP * 16, ST),
      visCount: B(NP * 4, ST),
      visList: B(NP * MAX_VIS * 4, ST),
      hitCount: B(8, SRC),
      hits: B(4096 * 16, SRC),

    const groups = {};

    const ps = new Float32Array(NP * 8);
    ps[0] = 30; ps[1] = 200; ps[2] = 30; ps[7] = 1;
    device.queue.writeBuffer(bufs.players, 0, ps);

    const cfgBuf = new ArrayBuffer(32);
    const cu = new Uint32Array(cfgBuf), cf = new Float32Array(cfgBuf);
    const writeCfg = (tick, cells) => {
      cu[0] = NP; cu[1] = HIST; cu[2] = tick; cu[3] = MAX_VIS;

          ]);
          device.queue.writeBuffer(bufs.bullets, slot * 32, b);

      const cellOf = new Uint32Array(bufs.stCellOf.getMappedRange()).slice();

      const hitsRaw = new Uint32Array(bufs.stHits.getMappedRange()).slice();
      const cratersRaw = new Float32Array(bufs.stCraters.getMappedRange()).slice();

      bufs.stHit.unmap(); bufs.stHits.unmap(); bufs.stCraters.unmap();

      const craterEvents = [];
      for(let i = 0; i < Math.min(hitU[1], 64); i++) {
        const c = [cratersRaw[i * 4], cratersRaw[i * 4 + 1], cratersRaw[i * 4 + 2], cratersRaw[i * 4 + 3]];
        craterEvents.push(c);
        hostCraterLog.push(c);
      }
      const killEvents = [];
      const deadNow = new Set();
      for(let i = 0; i < Math.min(hitU[0], 256); i++) {
        const shooter = hitsRaw[i * 4], victim = hitsRaw[i * 4 + 1];
        if(victim >= NP || deadNow.has(victim)) continue;
        deadNow.add(victim);

        const r1 = ((tick * 2654435761 + victim * 40503) % 400) - 200;
        const r2 = ((tick * 40503 + victim * 2654435761) % 400) - 200;

      }

      const uniq = new Map(), anchors = new Float32Array(MAX_CELLS * 4);
      for(let i = 0; i < NP; i++) {

        anchors[at * 4 + 1] += lastPlayers[i * 8 + 1];

        anchors[at * 4 + 3] += 1;
      }

      for(let a = 0; a < cells; a++) {

        const mx = lastPlayers[0], mz = lastPlayers[2];

          15 + (near.length + 1) * 18 + 6 + killEvents.length * 4

        }

        for(const s of shotEvents) {

        for(const c of craterEvents) {
          for(let f = 0; f < 4; f++) out.setFloat32(o + f * 4, c[f], true);
          o += 16;
        }
        handleSnapshot(out.buffer);
      }
      for(const [slot, g] of guests) {
        if(g.dc.readyState !== 'open' || g.dc.bufferedAmount > 65536 || slot >= NP) continue;
        const mx = lastPlayers[slot * 8], mz = lastPlayers[slot * 8 + 2];
        const lx = Math.sin(g.input[2]), lz = Math.cos(g.input[2]);
        const near = [slot];
        for(let i = 0; i < NP && near.length < 128; i++) {
          if(i === slot || lastPlayers[i * 8 + 7] < 0.5) continue;
          const dx = lastPlayers[i * 8] - mx, dz = lastPlayers[i * 8 + 2] - mz;
          const d2 = dx * dx + dz * dz;
          if(d2 >= R2) continue;
          const d = Math.sqrt(d2);
          const inCone = (dx * lx + dz * lz) / Math.max(1, d) > -0.34;
          let div = d < 150 ? 1 : d < 300 ? 2 : 3;
          if(!inCone) div *= 3;
          if((tick + i) % div === 0) near.push(i);
        }
        const out = new DataView(new ArrayBuffer(
          15 + near.length * 18 + 6 + killEvents.length * 4
          + shotEvents.length * 26 + craterEvents.length * 16));
        out.setUint8(0, 2);
        out.setUint32(1, tick, true);
        out.setUint32(5, g.seq, true);
        out.setFloat32(9, lastPlayers[slot * 8 + 5], true);
        out.setUint16(13, near.length, true);
        const remap = (i) => i === slot ? 0 : (i === 0 ? 999 : i);
        let o = 15;
        for(const i of near) {
          out.setUint16(o, remap(i), true);
          out.setFloat32(o + 2, lastPlayers[i * 8], true);
          out.setFloat32(o + 6, lastPlayers[i * 8 + 1], true);
          out.setFloat32(o + 10, lastPlayers[i * 8 + 2], true);
          out.setFloat32(o + 14, lastPlayers[i * 8 + 3], true);
          o += 18;
        }
        out.setUint16(o, killEvents.length, true); o += 2;
        for(const [s, vv] of killEvents) {
          out.setUint16(o, remap(s), true); out.setUint16(o + 2, remap(vv), true); o += 4;
        }
        out.setUint16(o, shotEvents.length, true); o += 2;
        for(const s of shotEvents) {
          out.setUint16(o, remap(s[0]), true);
          for(let f = 1; f < 7; f++) out.setFloat32(o + 2 + (f - 1) * 4, s[f], true);
          o += 26;
        }
        out.setUint16(o, craterEvents.length, true); o += 2;
        for(const c of craterEvents) {
          for(let f = 0; f < 4; f++) out.setFloat32(o + f * 4, c[f], true);
          o += 16;
        }
        g.dc.send(out.buffer);
        hostTx += out.buffer.byteLength;
      }
      stats.snap.push(performance.now() - tS);
      if(stats.snap.length > 300) stats.snap.shift();

      stats.sim.push(tB - tA); stats.cells.push(tD - tC); stats.read.push(tC - tB);
      stats.total.push(tD - tA);
      if(stats.total.length > 300) { stats.sim.shift(); stats.cells.shift(); stats.read.shift(); stats.total.shift(); }
      stats.tick = ++tick;

      if(tick % 15 === 0) {
        const q = (a, f) => { const v = [...a].sort((x, y) => x - y); return v[(v.length * f) | 0].toFixed(1); };
        el.textContent = `host · ${NP} players · ${guests.size} guests · conns ${conns.size} · cells ${cells}\n` +
          `tick ${q(stats.total, 0.5)}/${q(stats.total, 0.99)} ms (med/p99)\n` +
          `sim ${q(stats.sim, 0.5)} · readback ${q(stats.read, 0.5)} · cellvis ${q(stats.cells, 0.5)} · snap ${q(stats.snap, 0.5)}\n` +
          `tx ${(hostTx * 2 / 1024) | 0} KB/s`;
        hostTx = 0;
      }
      if(my === gen) setTimeout(step, Math.max(0, 1000 / TICKRATE - (performance.now() - tA)));
    };
    step();
  };
  boot();
})();
</script>
